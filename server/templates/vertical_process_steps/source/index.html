<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920,initial-scale=1.0">
<title>竖屏蓝图步骤</title>
<style>:root{--accent:#59d8ff}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{position:relative;font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
header,footer{position:relative;z-index:3;display:flex;justify-content:space-between;font:700 16px/1 "Courier New",monospace;letter-spacing:2px}
main{position:relative;z-index:2;padding-bottom:32px}.headline{margin:0;overflow-wrap:anywhere}.subtitle{overflow-wrap:anywhere}.metric:empty,.subtitle:empty,.bullets:empty{display:none}.logo,.quote-mark{display:none}
.reveal{opacity:.28;transform:translateY(26px);animation:reveal .72s cubic-bezier(.16,1,.3,1) forwards}.d1{animation-delay:.18s}.d2{animation-delay:.34s}
@keyframes reveal{to{opacity:1;transform:none}}@keyframes grow{to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1;transform:none}}

html,body{width:1080px;height:1920px}body{padding:56px 64px 330px}
main{margin-top:190px}.headline{font-size:92px;line-height:1.07;letter-spacing:-3px;max-width:900px}.subtitle{font-size:27px;line-height:1.52;max-width:850px;margin:28px 0 0}
.metric{font-size:86px;font-weight:900;line-height:1;margin-bottom:24px}.bullets{display:grid;gap:14px;margin-top:42px}.bullet{font-size:24px;line-height:1.38}
footer{position:absolute;left:64px;right:64px;bottom:365px;padding-top:18px}

body{background:#071c35;color:#eaf5ff;background-image:linear-gradient(rgba(89,216,255,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(89,216,255,.11) 1px,transparent 1px);background-size:54px 54px;border-left:18px solid var(--accent)}header{color:var(--accent)}.headline{font-size:94px}.subtitle{color:#adc8df}.bullet{display:grid;grid-template-columns:58px 1fr;gap:18px;align-items:center;min-height:96px;border:1px solid #315578;background:rgba(8,39,70,.9);padding:17px 20px;box-shadow:7px 7px 0 rgba(89,216,255,.12)}.bullet b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#071c35;font:900 20px/1 Arial}footer{border-top:1px solid #315578;color:var(--accent)}.decor{position:absolute;right:50px;top:170px;width:120px;height:120px;border:2px solid var(--accent);transform:rotate(45deg);opacity:.35}
</style>
</head>
<body data-hv-canvas data-width="1080" data-height="1920" data-template-family="technical-blueprint">
<div class="decor" aria-hidden="true"></div><div class="quote-mark" aria-hidden="true" data-layout-ignore>“</div>
<header><span class="logo">M</span><span data-hv-element-id="eyebrow" data-hv-bind="eyebrow" data-text-key="eyebrow">PLAYBOOK / 实操</span><span data-hv-element-id="section_no" data-hv-bind="section_no">03/05</span></header>
<main>
<div class="metric reveal" data-hv-element-id="metric" data-hv-bind="metric" data-text-key="metric"></div>
<h1 class="headline reveal d1" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline">三步把信息变成可执行方案</h1>
<div class="mock reveal d1"></div>
<p class="subtitle reveal d2" data-hv-element-id="subtitle" data-hv-bind="subtitle" data-text-key="subtitle">每一步只回答一个问题，避免画面有结论却没有行动。</p>
<section class="bullets" data-hv-element-id="bullets" data-hv-bind="bullets" data-text-key="body"><div class="bullet reveal" style="animation-delay:0.48s"><b>01</b><span>提取变化：只保留新增信息</span></div><div class="bullet reveal" style="animation-delay:0.59s"><b>02</b><span>解释影响：对应具体使用场景</span></div><div class="bullet reveal" style="animation-delay:0.7s"><b>03</b><span>设计验证：给出下一步测试动作</span></div></section>
</main>
<footer><span data-hv-element-id="footer_text" data-hv-bind="footer_text">WORKFLOW BLUEPRINT · 03</span><span>● MUSEDock</span></footer>
<script>
const variables=window.__HV_VARS__||{};
for(const node of document.querySelectorAll('[data-hv-bind]')){
  const key=node.dataset.hvBind;
  if(key!=='bullets'&&variables[key]!==undefined&&variables[key]!==null&&variables[key]!=='')node.textContent=String(variables[key]);
}
const bulletRoot=document.querySelector('[data-hv-bind="bullets"]');
if(bulletRoot&&Array.isArray(variables.bullets)&&variables.bullets.length){
  // 列表内容只通过 textContent 写入，保留模板结构并避免注入 HTML。
  bulletRoot.replaceChildren(...variables.bullets.slice(0,4).map((text,index)=>{
    const element=document.createElement('div');
    element.className='bullet reveal';
    element.style.animationDelay=(0.48+index*0.11)+'s';
    const number=document.createElement('b');
    number.textContent=String(index+1).padStart(2,'0');
    const content=document.createElement('span');
    content.textContent=String(text);
    element.append(number,content);
    return element;
  }));
}
</script>
</body>
</html>
