id: vertical_process_steps
name: 竖屏蓝图步骤
description: 深蓝工程蓝图、编号轨道和模块化步骤卡，适合教程、流程、检查清单与方法论。
category: 教程流程
tags:
  - 竖屏
  - 教程
  - 步骤
  - 流程
  - 蓝图
  - how-to
best_for:
  - 操作教程
  - 工作流拆解
  - 检查清单
  - 方法论
not_for:
  - 情绪故事
  - 单句观点
  - 需要真实照片主导的内容
scene_roles:
  - process
  - how_to
  - checklist
  - action
visual_family: technical-blueprint
engine: hyperframes
engine_version: 1.0.0
source_entry: source/index.html
output:
  resolution:
    width: 1080
    height: 1920
  fps: 30
  duration: 7
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    layout_variant:
      type: string
      required: false
      enum:
        - hook
        - detail
        - evidence
        - closing
      description: 根据场景职责切换开场、正文、证据或结尾构图。
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples:
    - layout_variant: detail
      eyebrow: PLAYBOOK / 实操
      section_no: 03/05
      headline: 三步把信息变成可执行方案
      subtitle: 每一步只回答一个问题，避免画面有结论却没有行动。
      bullets:
        - 提取变化：只保留新增信息
        - 解释影响：对应具体使用场景
        - 设计验证：给出下一步测试动作
      footer_text: WORKFLOW BLUEPRINT · 03
preview:
  poster: preview/poster.jpg
  title: 竖屏蓝图步骤预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
