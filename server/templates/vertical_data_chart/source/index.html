<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,height=1920,initial-scale=1.0"><title>竖屏数据图解</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{position:relative;padding:82px 68px 365px;background:#071526;color:#eff7f6;font-family:"PingFang SC","Microsoft YaHei",sans-serif}body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(89,226,206,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(89,226,206,.06) 1px,transparent 1px);background-size:64px 64px}header,main,footer{position:relative;z-index:2}header{display:flex;justify-content:space-between;color:#65f0d6;font:800 21px/1 "Courier New",monospace;letter-spacing:3px}.headline{margin:104px 0 0;max-width:900px;font-size:76px;line-height:1.06;letter-spacing:-3px;overflow-wrap:anywhere}.subtitle{max-width:840px;font-size:28px;line-height:1.5;color:#a9bbc6;margin:24px 0 0}.chart-card{position:relative;margin-top:66px;height:570px;border:2px solid rgba(101,240,214,.28);background:rgba(5,19,34,.82);padding:42px 36px 48px;box-shadow:18px 18px 0 rgba(21,75,95,.5)}.metric{position:absolute;right:38px;top:30px;color:#ffb64c;font:900 92px/1 Arial}.bars{height:100%;display:flex;align-items:flex-end;gap:28px;padding-top:120px}.bar-column{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;text-align:center}.bar{height:var(--height);min-height:28px;background:linear-gradient(180deg,#65f0d6,#2189c9);transform:scaleY(0);transform-origin:bottom;animation:grow .8s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay);border-top:7px solid #ffb64c}.bar-value{font:900 28px/1 Arial;color:#fff}.bar-label{font:800 22px/1.2 "Courier New",monospace;color:#a9bbc6}.reveal{opacity:.08;transform:translateY(26px);animation:reveal .7s cubic-bezier(.16,1,.3,1) both}@keyframes reveal{to{opacity:1;transform:none}}@keyframes grow{to{transform:scaleY(1)}}footer{position:absolute;left:68px;right:68px;bottom:365px;display:flex;justify-content:space-between;border-top:2px solid #2d5667;padding-top:18px;color:#8ba3af;font:800 19px/1.2 "Courier New",monospace}body[data-layout-variant="hook"] .headline{margin-top:280px;font-size:100px}body[data-layout-variant="hook"] .chart-card{display:none}body[data-layout-variant="evidence"] .headline{margin-top:54px;font-size:64px}body[data-layout-variant="evidence"] .chart-card{margin-top:44px;height:680px}body[data-layout-variant="closing"] .headline{margin-top:310px}body[data-layout-variant="closing"] .chart-card{height:auto;margin-top:55px;padding:0;border:0;background:transparent;box-shadow:none}body[data-layout-variant="closing"] .bars{display:none}body[data-layout-variant="closing"] .metric{position:static;font-size:160px;margin-top:55px}
</style></head><body data-hv-canvas data-width="1080" data-height="1920" data-template-family="signal-chart-vertical"><header><span data-hv-bind="eyebrow">DATA SIGNAL</span><span data-hv-bind="section_no">04/06</span></header><main><h1 class="headline reveal" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline">真正拉开差距的，是返工次数</h1><p class="subtitle reveal" data-hv-bind="subtitle" data-text-key="subtitle" style="animation-delay:.14s">首版速度接近，但进入修改环节后，结构化草稿更容易收敛。</p><section class="chart-card reveal" style="animation-delay:.28s"><div class="metric" data-hv-bind="metric">-42%</div><div class="bars" data-hv-bind="chart"></div></section></main><footer><span data-hv-bind="footer_text">示例数据 · 请替换为真实来源</span><span>● VERIFIED INPUT</span></footer><script>
const variables=window.__HV_VARS__||{};const isPreview=window.__HV_SCENE__?.preview===true;const values=Array.isArray(variables.chart_values)&&variables.chart_values.length?variables.chart_values.slice(0,4):(isPreview?[92,68,49,31]:[]);const labels=Array.isArray(variables.chart_labels)&&variables.chart_labels.length?variables.chart_labels.slice(0,4):(isPreview?['首版','复核','修改','定稿']:[]);const variants=['hook','detail','evidence','closing'];document.body.dataset.layoutVariant=variants.includes(variables.layout_variant)?variables.layout_variant:'detail';for(const node of document.querySelectorAll('[data-hv-bind]:not([data-hv-bind="chart"])')){const key=node.dataset.hvBind;if(variables[key]!==undefined&&variables[key]!==null&&variables[key]!=='')node.textContent=String(variables[key]);else if(!isPreview)node.textContent=''}const numeric=values.map(value=>Number(value)||0);const max=Math.max(...numeric.map(Math.abs),1);const root=document.querySelector('[data-hv-bind="chart"]');numeric.forEach((value,index)=>{const column=document.createElement('div');column.className='bar-column';const number=document.createElement('div');number.className='bar-value';number.textContent=String(value);const bar=document.createElement('div');bar.className='bar';bar.style.setProperty('--height',Math.max(8,Math.abs(value)/max*100)+'%');bar.style.setProperty('--delay',(.42+index*.1)+'s');const label=document.createElement('div');label.className='bar-label';label.textContent=String(labels[index]||('项 '+(index+1)));column.append(number,bar,label);root.appendChild(column)});
</script></body></html>
