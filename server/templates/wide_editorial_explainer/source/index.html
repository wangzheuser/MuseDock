</style></head><body data-hv-canvas data-width="1920" data-height="1080" data-template-family="wide-editorial-dossier"><header><span data-hv-bind="eyebrow">EDITORIAL DOSSIER</span><span data-hv-bind="section_no">02 / 06</span></header><main class="layout"><section><div class="metric reveal" data-hv-bind="metric">03</div><h1 class="headline reveal" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline" style="animation-delay:.12s">真正值得关注的，不只是消息本身</h1><p class="subtitle reveal" data-hv-bind="subtitle" data-text-key="subtitle" style="animation-delay:.24s">把事实、变化和影响拆开，观众才知道这件事与自己有什么关系。</p></section><section class="bullets" data-hv-bind="bullets" data-text-key="body"></section></main><footer><span data-hv-bind="footer_text">FACT → CHANGE → IMPACT</span><span>● MUSEDock EDITORIAL</span></footer><script>
