<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080,initial-scale=1.0"><title>横屏流程蓝图</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{position:relative;padding:62px 82px 180px;background:#0d302b;color:#f0eddf;font-family:"PingFang SC","Microsoft YaHei",sans-serif}body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(139,210,187,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(139,210,187,.08) 1px,transparent 1px);background-size:42px 42px}header,main,footer{position:relative;z-index:2}header{display:flex;justify-content:space-between;color:#8bd2bb;font:800 20px/1 "Courier New",monospace;letter-spacing:3px}.top{margin-top:58px;display:flex;justify-content:space-between;gap:70px;align-items:flex-end}.headline{margin:0;max-width:1180px;font-size:78px;line-height:1.04;letter-spacing:-3px;overflow-wrap:anywhere}.metric{color:#ffad5c;font:900 45px/1 "Courier New",monospace;white-space:nowrap}.subtitle{font-size:27px;line-height:1.45;color:#b8cabf;margin:22px 0 0;max-width:1100px}.track{position:relative;margin-top:86px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.track:before{content:"";position:absolute;left:6%;right:6%;top:39px;height:5px;background:#8bd2bb;transform:scaleX(0);transform-origin:left;animation:line .9s .24s cubic-bezier(.16,1,.3,1) both}.step{position:relative;padding-top:84px;min-height:245px}.dot{position:absolute;top:15px;left:24px;width:54px;height:54px;border-radius:50%;background:#ffad5c;border:10px solid #0d302b;box-shadow:0 0 0 3px #8bd2bb}.step-copy{height:100%;border:2px solid rgba(139,210,187,.42);background:rgba(5,27,23,.7);padding:28px 26px;font-size:25px;line-height:1.42;font-weight:800}.step-no{display:block;color:#ffad5c;font:900 20px/1 "Courier New",monospace;margin-bottom:16px}.reveal{opacity:.08;transform:translateY(22px);animation:reveal .68s cubic-bezier(.16,1,.3,1) both}@keyframes reveal{to{opacity:1;transform:none}}@keyframes line{to{transform:scaleX(1)}}footer{position:absolute;left:82px;right:82px;bottom:180px;border-top:2px solid #527d70;padding-top:16px;display:flex;justify-content:space-between;color:#8fb1a5;font:800 17px/1.2 "Courier New",monospace}body[data-layout-variant="hook"] .top{margin-top:160px;display:block}body[data-layout-variant="hook"] .headline{font-size:110px;max-width:1450px}body[data-layout-variant="hook"] .metric{margin-top:48px}body[data-layout-variant="hook"] .track{display:none}body[data-layout-variant="evidence"] .top{margin-top:32px}body[data-layout-variant="evidence"] .headline{font-size:66px}body[data-layout-variant="evidence"] .track{margin-top:52px}body[data-layout-variant="closing"] .top{margin-top:180px;display:block;text-align:center}body[data-layout-variant="closing"] .headline,body[data-layout-variant="closing"] .subtitle{margin-left:auto;margin-right:auto}body[data-layout-variant="closing"] .track{display:none}body[data-layout-variant="closing"] .metric{margin-top:52px}
</style></head><body data-hv-canvas data-width="1920" data-height="1080" data-template-family="wide-process-track"><header><span data-hv-bind="eyebrow">PROCESS BLUEPRINT</span><span data-hv-bind="section_no">04 / 06</span></header><main><section class="top"><div><h1 class="headline reveal" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline">优质内容不是写完，而是跑完这条链路</h1><p class="subtitle reveal" data-hv-bind="subtitle" data-text-key="subtitle" style="animation-delay:.14s">把资料、判断、镜头和复核分开，每一步都有明确产物。</p></div><div class="metric reveal" data-hv-bind="metric" style="animation-delay:.2s">04 STEPS</div></section><section class="track" data-hv-bind="bullets" data-text-key="body"></section></main><footer><span data-hv-bind="footer_text">INPUT → INSIGHT → SCENE → REVIEW</span><span>● PROCESS MAP</span></footer><script>
const variables=window.__HV_VARS__||{};const isPreview=window.__HV_SCENE__?.preview===true;const defaults=['搜集｜保留出处与时间','判断｜提炼变化与影响','编排｜一镜头一个收获','复核｜检查事实与可读性'];const variants=['hook','detail','evidence','closing'];document.body.dataset.layoutVariant=variants.includes(variables.layout_variant)?variables.layout_variant:'detail';for(const node of document.querySelectorAll('[data-hv-bind]:not([data-hv-bind="bullets"])')){const key=node.dataset.hvBind;if(variables[key]!==undefined&&variables[key]!==null&&variables[key]!=='')node.textContent=String(variables[key]);else if(!isPreview)node.textContent=''}const items=Array.isArray(variables.bullets)&&variables.bullets.length?variables.bullets:(isPreview?defaults:[]);const root=document.querySelector('[data-hv-bind="bullets"]');items.slice(0,4).forEach((text,index)=>{const step=document.createElement('article');step.className='step reveal';step.style.animationDelay=(.36+index*.1)+'s';const dot=document.createElement('span');dot.className='dot';const copy=document.createElement('div');copy.className='step-copy';const number=document.createElement('span');number.className='step-no';number.textContent='STEP '+String(index+1).padStart(2,'0');const content=document.createElement('span');content.textContent=String(text);copy.append(number,content);step.append(dot,copy);root.appendChild(step)});
</script></body></html>
