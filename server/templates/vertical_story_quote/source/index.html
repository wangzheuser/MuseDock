<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920,initial-scale=1.0">
<title>竖屏人物观点</title>
<style>:root{--accent:#f0b35b}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{position:relative;font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
header,footer{position:relative;z-index:3;display:flex;justify-content:space-between;font:700 16px/1 "Courier New",monospace;letter-spacing:2px}
main{position:relative;z-index:2;padding-bottom:32px}.headline{margin:0;overflow-wrap:anywhere}.subtitle{overflow-wrap:anywhere}.metric:empty,.subtitle:empty,.bullets:empty{display:none}.logo,.quote-mark{display:none}
.reveal{opacity:.28;transform:translateY(26px);animation:reveal .72s cubic-bezier(.16,1,.3,1) forwards}.d1{animation-delay:.18s}.d2{animation-delay:.34s}
@keyframes reveal{to{opacity:1;transform:none}}@keyframes grow{to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1;transform:none}}

html,body{width:1080px;height:1920px}body{padding:56px 64px 330px}
main{margin-top:190px}.headline{font-size:92px;line-height:1.07;letter-spacing:-3px;max-width:900px}.subtitle{font-size:27px;line-height:1.52;max-width:850px;margin:28px 0 0}
.metric{font-size:86px;font-weight:900;line-height:1;margin-bottom:24px}.bullets{display:grid;gap:14px;margin-top:42px}.bullet{font-size:24px;line-height:1.38}
footer{position:absolute;left:64px;right:64px;bottom:365px;padding-top:18px}

body{background:#27101f;color:#fff5e7}.decor{position:absolute;width:880px;height:880px;right:-280px;top:300px;border-radius:50%;background:radial-gradient(circle,#aa473f 0%,rgba(126,40,55,.5) 42%,transparent 70%)}.quote-mark{display:block;position:absolute;left:18px;top:150px;font:700 650px/1 Georgia,serif;color:rgba(240,179,91,.1)}header,footer,.metric{color:var(--accent)}.headline{font-family:STSong,"Songti SC",serif;font-size:96px;line-height:1.17}.subtitle{font-family:STSong,"Songti SC",serif;color:#dfcabc;font-size:32px;border-left:5px solid var(--accent);padding-left:22px}.bullets{display:none}footer{border-top:1px solid rgba(240,179,91,.4)}

body[data-layout-variant="hook"] main{margin-top:285px}
body[data-layout-variant="hook"] .headline{font-size:112px;max-width:930px}
body[data-layout-variant="hook"] .subtitle{max-width:730px}
body[data-layout-variant="evidence"] main{margin-top:130px}
body[data-layout-variant="evidence"] .metric{display:block;font-size:132px;margin-bottom:34px}
body[data-layout-variant="closing"] main{margin-top:360px;text-align:right}
body[data-layout-variant="closing"] .headline,body[data-layout-variant="closing"] .subtitle{margin-left:auto}
body[data-layout-variant="closing"] .bullets,body[data-layout-variant="closing"] .mock{display:none}
</style>
</head>
<body data-hv-canvas data-width="1080" data-height="1920" data-template-family="theatrical-quote">
<div class="decor" aria-hidden="true"></div><div class="quote-mark" aria-hidden="true" data-layout-ignore>“</div>
<header><span class="logo">M</span><span data-hv-element-id="eyebrow" data-hv-bind="eyebrow" data-text-key="eyebrow">POINT OF VIEW / 观点</span><span data-hv-element-id="section_no" data-hv-bind="section_no">04/07</span></header>
<main>
<div class="metric reveal" data-hv-element-id="metric" data-hv-bind="metric" data-text-key="metric">INSIGHT</div>
<h1 class="headline reveal d1" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline">用户不缺更多消息，缺的是看完之后知道怎么办</h1>
<div class="mock reveal d1"></div>
<p class="subtitle reveal d2" data-hv-element-id="subtitle" data-hv-bind="subtitle" data-text-key="subtitle">好的内容不急着替观众下结论，而是交付一个更清晰的观察角度。</p>
<section class="bullets" data-hv-element-id="bullets" data-hv-bind="bullets" data-text-key="body"></section>
</main>
<footer><span data-hv-element-id="footer_text" data-hv-bind="footer_text">CONVERSATION SERIES · MUSEDock</span><span>● MUSEDock</span></footer>
<script>
const variables=window.__HV_VARS__||{};
const layoutVariants=['hook','detail','evidence','closing'];
document.body.dataset.layoutVariant=layoutVariants.includes(variables.layout_variant)?variables.layout_variant:'detail';
for(const node of document.querySelectorAll('[data-hv-bind]')){
  const key=node.dataset.hvBind;
  if(key!=='bullets'&&variables[key]!==undefined&&variables[key]!==null&&variables[key]!=='')node.textContent=String(variables[key]);
}
const bulletRoot=document.querySelector('[data-hv-bind="bullets"]');
if(bulletRoot&&Array.isArray(variables.bullets)&&variables.bullets.length){
  // 列表内容只通过 textContent 写入，保留模板结构并避免注入 HTML。
  bulletRoot.replaceChildren(...variables.bullets.slice(0,4).map((text,index)=>{
    const element=document.createElement('div');
    element.className='bullet reveal';
    element.style.animationDelay=(0.48+index*0.11)+'s';
    const number=document.createElement('b');
    number.textContent=String(index+1).padStart(2,'0');
    const content=document.createElement('span');
    content.textContent=String(text);
    element.append(number,content);
    return element;
  }));
}
</script>
</body>
</html>
