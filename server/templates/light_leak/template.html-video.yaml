id: light_leak
name: 漏光电影
description: 35mm 胶片、暖色漏光与暗角质感，适合人物、旅行、情绪和故事化叙述。
category: 故事叙事
tags:
  - 横屏
  - 电影
  - 胶片
  - 旅行
  - 人物
best_for:
  - 人物故事
  - 旅行回忆
  - 情绪转场
  - 叙事结尾
not_for:
  - 科技参数
  - 密集数据
  - 高速教程
scene_roles:
  - story
  - reflection
  - ending
visual_family: cinematic-film
engine: hyperframes
engine_version: 1.0.0
source_entry: source.html
output:
  resolution:
    width: 1920
    height: 1080
  fps: 30
  duration: 8
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples: []
preview:
  poster: preview/poster.jpg
  title: 漏光电影预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
