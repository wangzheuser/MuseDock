id: portrait_data_story
name: 竖版数据故事
description: 4:5 瑞士统计网格、柱状变化和来源区，适合有明确证据的数据、排名与阶段进展。
category: 数据图表
tags:
  - 4:5
  - 数据
  - 统计
  - 排名
  - 图表
  - evidence
best_for:
  - 有来源的数据
  - 阶段进展
  - 排名对比
  - 量化结果
not_for:
  - 无法确认数字的传闻
  - 人物情绪故事
  - 纯品牌氛围
scene_roles:
  - evidence
  - result
  - comparison
visual_family: portrait-swiss-data
evidence_policy: 数字和来源字段缺失时不要选择该模板。
engine: hyperframes
engine_version: 1.0.0
source_entry: source/index.html
output:
  resolution:
    width: 1080
    height: 1350
  fps: 30
  duration: 7
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples:
    - eyebrow: EVIDENCE / 数据
      section_no: 03/06
      metric: +38%
      headline: 把数字放回比较基准里
      subtitle: 单个数字没有意义，变化幅度、时间范围和来源才决定它说明什么。
      bullets:
        - 基准：上一周期
        - 范围：同口径样本
        - 来源：公开可追溯
      footer_text: SOURCE REQUIRED · NO FABRICATION
preview:
  poster: preview/poster.jpg
  title: 竖版数据故事预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
