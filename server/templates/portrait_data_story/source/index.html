<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1350,initial-scale=1.0">
<title>竖版数据故事</title>
<style>:root{--accent:#e84731}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{position:relative;font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
header,footer{position:relative;z-index:3;display:flex;justify-content:space-between;font:700 16px/1 "Courier New",monospace;letter-spacing:2px}
main{position:relative;z-index:2;padding-bottom:32px}.headline{margin:0;overflow-wrap:anywhere}.subtitle{overflow-wrap:anywhere}.metric:empty,.subtitle:empty,.bullets:empty{display:none}.logo,.quote-mark{display:none}
.reveal{opacity:.28;transform:translateY(26px);animation:reveal .72s cubic-bezier(.16,1,.3,1) forwards}.d1{animation-delay:.18s}.d2{animation-delay:.34s}
@keyframes reveal{to{opacity:1;transform:none}}@keyframes grow{to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1;transform:none}}

html,body{width:1080px;height:1350px}body{padding:56px 64px 330px}
main{margin-top:86px}.headline{font-size:70px;line-height:1.07;letter-spacing:-3px;max-width:900px}.subtitle{font-size:27px;line-height:1.52;max-width:850px;margin:28px 0 0}
.metric{font-size:86px;font-weight:900;line-height:1;margin-bottom:24px}.bullets{display:grid;gap:14px;margin-top:42px}.bullet{font-size:24px;line-height:1.38}
footer{position:absolute;left:64px;right:64px;bottom:330px;padding-top:18px}

body{background:#f7f7f2;color:#111;background-image:linear-gradient(#deded7 1px,transparent 1px),linear-gradient(90deg,#deded7 1px,transparent 1px);background-size:54px 54px}header{background:#111;color:#fff;padding:14px 16px}.metric{color:var(--accent);font-size:116px;letter-spacing:-7px}.headline{font-size:52px;max-width:580px}.mock{position:absolute;right:0;top:100px;width:360px;height:280px;border-left:3px solid #111;border-bottom:3px solid #111;display:flex;align-items:flex-end;gap:14px;padding-left:18px}.mock i{display:block;flex:1;background:#111}.mock i:nth-child(1){height:30%}.mock i:nth-child(2){height:48%}.mock i:nth-child(3){height:67%}.mock i:nth-child(4){height:91%;background:var(--accent)}.subtitle{margin-top:190px;background:#f7f7f2;border:2px solid #111;padding:17px 20px}.bullets{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.bullet{background:#111;color:#fff;min-height:102px;padding:15px;font-size:17px}.bullet b{display:block;color:var(--accent);font:800 14px/1 "Courier New",monospace;margin-bottom:11px}footer{background:var(--accent);color:#fff;padding:13px 15px;border:0}
</style>
</head>
<body data-hv-canvas data-width="1080" data-height="1350" data-template-family="portrait-swiss-data">
<div class="decor" aria-hidden="true"></div><div class="quote-mark" aria-hidden="true" data-layout-ignore>“</div>
<header><span class="logo">M</span><span data-hv-element-id="eyebrow" data-hv-bind="eyebrow" data-text-key="eyebrow">EVIDENCE / 数据</span><span data-hv-element-id="section_no" data-hv-bind="section_no">03/06</span></header>
<main>
<div class="metric reveal" data-hv-element-id="metric" data-hv-bind="metric" data-text-key="metric">+38%</div>
<h1 class="headline reveal d1" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline">把数字放回比较基准里</h1>
<div class="mock reveal d1"><i></i><i></i><i></i><i></i></div>
<p class="subtitle reveal d2" data-hv-element-id="subtitle" data-hv-bind="subtitle" data-text-key="subtitle">单个数字没有意义，变化幅度、时间范围和来源才决定它说明什么。</p>
<section class="bullets" data-hv-element-id="bullets" data-hv-bind="bullets" data-text-key="body"><div class="bullet reveal" style="animation-delay:0.48s"><b>01</b><span>基准：上一周期</span></div><div class="bullet reveal" style="animation-delay:0.59s"><b>02</b><span>范围：同口径样本</span></div><div class="bullet reveal" style="animation-delay:0.7s"><b>03</b><span>来源：公开可追溯</span></div></section>
</main>
<footer><span data-hv-element-id="footer_text" data-hv-bind="footer_text">SOURCE REQUIRED · NO FABRICATION</span><span>● MUSEDock</span></footer>
<script>
const variables=window.__HV_VARS__||{};
for(const node of document.querySelectorAll('[data-hv-bind]')){
  const key=node.dataset.hvBind;
  if(key!=='bullets'&&variables[key]!==undefined&&variables[key]!==null&&variables[key]!=='')node.textContent=String(variables[key]);
}
const bulletRoot=document.querySelector('[data-hv-bind="bullets"]');
if(bulletRoot&&Array.isArray(variables.bullets)&&variables.bullets.length){
  // 列表内容只通过 textContent 写入，保留模板结构并避免注入 HTML。
  bulletRoot.replaceChildren(...variables.bullets.slice(0,4).map((text,index)=>{
    const element=document.createElement('div');
    element.className='bullet reveal';
    element.style.animationDelay=(0.48+index*0.11)+'s';
    const number=document.createElement('b');
    number.textContent=String(index+1).padStart(2,'0');
    const content=document.createElement('span');
    content.textContent=String(text);
    element.append(number,content);
    return element;
  }));
}
</script>
</body>
</html>
