<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,height=1080,initial-scale=1.0"><title>方形数据证据</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1080px;overflow:hidden}body{position:relative;padding:54px 60px 290px;background:#eee8da;color:#161813;font-family:"PingFang SC","Microsoft YaHei",sans-serif}body:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(17,40,88,.07) 32px)}header,main,footer{position:relative;z-index:2}header{display:flex;justify-content:space-between;color:#163d8f;font:800 17px/1 "Courier New",monospace;letter-spacing:2px}.layout{margin-top:42px;display:grid;grid-template-columns:430px 1fr;gap:46px}.headline{margin:0;font:900 57px/1.06 "Songti SC",serif;letter-spacing:-2px;overflow-wrap:anywhere}.subtitle{font-size:21px;line-height:1.5;color:#5d5d55;margin:22px 0 0}.metric{margin-top:28px;color:#df4335;font:900 90px/1 Arial}.chart{height:420px;border-left:3px solid #163d8f;border-bottom:3px solid #163d8f;padding:26px 22px 0;display:flex;align-items:flex-end;gap:18px}.bar-column{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}.bar{width:100%;height:var(--height);background:#194da8;transform:scaleY(0);transform-origin:bottom;animation:grow .72s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}.bar:nth-child(even){background:#df4335}.value{font:900 19px/1 Arial}.label{font:800 15px/1 "Courier New",monospace}.reveal{opacity:.08;transform:translateY(20px);animation:reveal .65s cubic-bezier(.16,1,.3,1) both}@keyframes reveal{to{opacity:1;transform:none}}@keyframes grow{to{transform:scaleY(1)}}footer{position:absolute;left:60px;right:60px;bottom:290px;border-top:2px solid #171813;padding-top:15px;display:flex;justify-content:space-between;font:800 15px/1.2 "Courier New",monospace}body[data-layout-variant="hook"] .layout{display:block;margin-top:110px}body[data-layout-variant="hook"] .headline{font-size:78px;max-width:860px}body[data-layout-variant="hook"] .chart{display:none}body[data-layout-variant="evidence"] .layout{grid-template-columns:350px 1fr}body[data-layout-variant="evidence"] .chart{height:450px}body[data-layout-variant="closing"] .layout{display:block;margin-top:150px;text-align:center}body[data-layout-variant="closing"] .chart{display:none}body[data-layout-variant="closing"] .metric{font-size:130px}
</style></head><body data-hv-canvas data-width="1080" data-height="1080" data-template-family="square-data-ledger"><header><span data-hv-bind="eyebrow">EVIDENCE CARD</span><span data-hv-bind="section_no">03/05</span></header><main class="layout"><section><h1 class="headline reveal" data-hv-element-id="headline" data-hv-bind="headline" data-text-key="headline">修改成本，才是被忽略的变量</h1><p class="subtitle reveal" data-hv-bind="subtitle" style="animation-delay:.14s">四个阶段放在一起，差距才变得可见。</p><div class="metric reveal" data-hv-bind="metric" style="animation-delay:.26s">42%</div></section><section class="chart reveal" data-hv-bind="chart" style="animation-delay:.18s"></section></main><footer><span data-hv-bind="footer_text">示例结构 · 使用时标注真实来源</span><span>● DATA LEDGER</span></footer><script>
const variables=window.__HV_VARS__||{};const isPreview=window.__HV_SCENE__?.preview===true;const values=Array.isArray(variables.chart_values)&&variables.chart_values.length?variables.chart_values.slice(0,4):(isPreview?[92,72,48,29]:[]);const labels=Array.isArray(variables.chart_labels)&&variables.chart_labels.length?variables.chart_labels.slice(0,4):(isPreview?['生成','复核','调整','发布']:[]);const variants=['hook','detail','evidence','closing'];document.body.dataset.layoutVariant=variants.includes(variables.layout_variant)?variables.layout_variant:'detail';for(const node of document.querySelectorAll('[data-hv-bind]:not([data-hv-bind="chart"])')){const key=node.dataset.hvBind;if(variables[key]!==undefined&&variables[key]!==null&&variables[key]!=='')node.textContent=String(variables[key]);else if(!isPreview)node.textContent=''}const numeric=values.map(value=>Number(value)||0);const max=Math.max(...numeric.map(Math.abs),1);const root=document.querySelector('[data-hv-bind="chart"]');numeric.forEach((value,index)=>{const column=document.createElement('div');column.className='bar-column';const number=document.createElement('div');number.className='value';number.textContent=String(value);const bar=document.createElement('div');bar.className='bar';bar.style.setProperty('--height',Math.max(8,Math.abs(value)/max*100)+'%');bar.style.setProperty('--delay',(.32+index*.08)+'s');const label=document.createElement('div');label.className='label';label.textContent=String(labels[index]||('项'+(index+1)));column.append(number,bar,label);root.appendChild(column)});
</script></body></html>
