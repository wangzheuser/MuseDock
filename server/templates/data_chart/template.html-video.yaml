id: data_chart
name: 编辑部趋势图
description: 报纸编辑风折线图、注释和来源栏，适合有明确数据来源的趋势解释。
category: 数据图表
tags:
  - 横屏
  - 数据
  - 趋势
  - 折线图
  - 报告
best_for:
  - 趋势变化
  - 行业报告
  - 时间线数据
  - 有来源的数据故事
not_for:
  - 没有可靠数字的观点
  - 品牌氛围片
  - 纯情绪叙事
scene_roles:
  - evidence
  - comparison
  - explain
visual_family: newspaper-chart
evidence_policy: 仅在输入材料明确提供数据与来源时选择。
engine: hyperframes
engine_version: 1.0.0
source_entry: source.html
output:
  resolution:
    width: 1920
    height: 1080
  fps: 30
  duration: 8
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples: []
preview:
  poster: preview/poster.jpg
  title: 编辑部趋势图预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
