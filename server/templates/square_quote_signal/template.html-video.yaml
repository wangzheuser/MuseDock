id: square_quote_signal
name: 方形霓虹观点
description: 黑底青色信号线、超大短句和极简元数据，适合高记忆点观点与评论区引导。
category: 观点表达
tags:
  - 方形
  - 观点
  - 霓虹
  - 短句
  - 评论
  - signal
best_for:
  - 强观点
  - 反问开场
  - 评论引导
  - 一句话洞察
not_for:
  - 密集教程
  - 详细数据来源
  - 多卡片总结
scene_roles:
  - hook
  - quote
  - discussion
  - cta
visual_family: neon-opinion
engine: hyperframes
engine_version: 1.0.0
source_entry: source/index.html
output:
  resolution:
    width: 1080
    height: 1080
  fps: 30
  duration: 5
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples:
    - eyebrow: OPEN QUESTION / 讨论
      section_no: 03/06
      metric: WHY?
      headline: 内容的价值，是信息量还是判断力？
      subtitle: 把你的标准留在评论区。
      bullets: []
      footer_text: SIGNAL / 03
preview:
  poster: preview/poster.jpg
  title: 方形霓虹观点预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
