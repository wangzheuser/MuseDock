id: pentagram_stat
name: 瑞士网格统计
description: 黑白瑞士网格、巨型数字与红色强调线，适合有依据的指标、评分和对比。
category: 数据图表
tags:
  - 横屏
  - 统计
  - 瑞士网格
  - 指标
  - benchmark
best_for:
  - 关键指标
  - 评分展示
  - 基准对比
  - 量化结论
not_for:
  - 没有数字证据的内容
  - 人物情绪故事
  - 纯品牌氛围
scene_roles:
  - evidence
  - comparison
  - result
visual_family: swiss-stat
evidence_policy: 禁止为填满版式而虚构数字。
engine: hyperframes
engine_version: 1.0.0
source_entry: source.html
output:
  resolution:
    width: 1920
    height: 1080
  fps: 30
  duration: 6
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples: []
preview:
  poster: preview/poster.jpg
  title: 瑞士网格统计预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
