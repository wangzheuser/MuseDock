id: vertical_editorial_digest
name: 竖屏编辑部解读
description: 象牙白杂志版式、黑红编辑线和高密度要点，适合解释背景、拆解影响与给出判断框架。
category: 深度解读
tags:
  - 竖屏
  - 解读
  - 编辑
  - 杂志
  - 要点
  - analysis
best_for:
  - 热点解读
  - 背景补充
  - 影响分析
  - 知识拆解
not_for:
  - 纯产品演示
  - 强游戏风
  - 只有单个数字的画面
scene_roles:
  - hook
  - context
  - explain
  - conclusion
visual_family: editorial-light
engine: hyperframes
engine_version: 1.0.0
source_entry: source/index.html
output:
  resolution:
    width: 1080
    height: 1920
  fps: 30
  duration: 7
  duration_range_sec:
    - 2
    - 90
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 36
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 栏目、分类或上下文标签。
    subtitle:
      type: string
      required: false
      max_length: 72
      description: 补充解释或结论。
    metric:
      type: string
      required: false
      max_length: 24
      description: 仅在素材明确提供时展示的数字或关键词。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 当前场景的要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/06。
    footer_text:
      type: string
      required: false
      max_length: 40
      description: 来源、提示或页脚说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples:
    - eyebrow: FIELD NOTES / 解读
      section_no: 02/06
      headline: 真正值得关注的，不只是消息本身
      subtitle: 把变化拆成背景、影响和下一步，你才能知道它和自己有什么关系。
      bullets:
        - 发生了什么：先抓住确定变化
        - 为什么重要：识别真正受影响的人
        - 接下来怎么看：给出可验证的观察点
      footer_text: MUSEDock · EDITORIAL DIGEST
preview:
  poster: preview/poster.jpg
  title: 竖屏编辑部解读预览
  sample_time_sec: 1.2
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
